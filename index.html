<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Delete Account</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
      input, button { width: 100%; padding: 12px; margin: 8px 0; }
      button { cursor: pointer; }
      .danger { background: #b00020; color: white; border: 0; }
      .muted { color: #666; font-size: 14px; }
      .box { border: 1px solid #ddd; padding: 16px; border-radius: 10px; }
    </style>
  </head>
  <body>
    <h2>Delete your account</h2>

    <div class="box" id="signedOutBox">
      <p class="muted">Sign in to delete your account.</p>
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <button id="signInBtn">Sign In</button>
      <p id="msg" class="muted"></p>
    </div>

    <div class="box" id="signedInBox" style="display:none;">
      <p id="who" class="muted"></p>
      <p><b>Warning:</b> This permanently deletes your account and data.</p>

      <label class="muted">
        Type <b>DELETE</b> to confirm:
      </label>
      <input id="confirmText" placeholder="DELETE" />

      <button class="danger" id="deleteBtn" disabled>Delete My Account</button>
      <button id="signOutBtn">Sign Out</button>

      <p id="msg2" class="muted"></p>
    </div>

    <script type="module">
      import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

      // TODO: put your project values here (safe to expose)
      const SUPABASE_URL = "https://mvmvqycvorstsftcldzs.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12bXZxeWN2b3JzdHNmdGNsZHpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTUwMDczNTQsImV4cCI6MjA3MDU4MzM1NH0.gA744wsXronSyRXHCS60DVcVqJ3_y0MgkqEhLsFxYDI";

      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const signedOutBox = document.getElementById("signedOutBox");
      const signedInBox  = document.getElementById("signedInBox");
      const msg = document.getElementById("msg");
      const msg2 = document.getElementById("msg2");

      const signInBtn = document.getElementById("signInBtn");
      const signOutBtn = document.getElementById("signOutBtn");
      const deleteBtn = document.getElementById("deleteBtn");
      const confirmText = document.getElementById("confirmText");

      function setSignedInUI(user) {
        if (user) {
          signedOutBox.style.display = "none";
          signedInBox.style.display = "block";
          document.getElementById("who").textContent = `Signed in as: ${user.email}`;
        } else {
          signedInBox.style.display = "none";
          signedOutBox.style.display = "block";
        }
      }

      // Enable delete only when user types DELETE
      confirmText.addEventListener("input", () => {
        deleteBtn.disabled = (confirmText.value.trim() !== "DELETE");
      });

      signInBtn.addEventListener("click", async () => {
        msg.textContent = "";
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          msg.textContent = error.message;
          return;
        }
        setSignedInUI(data.user);
      });

      signOutBtn.addEventListener("click", async () => {
        await supabase.auth.signOut();
        setSignedInUI(null);
      });

      deleteBtn.addEventListener("click", async () => {
        msg2.textContent = "";

        // Extra confirmation (browser-native)
        const ok = confirm("This will permanently delete your account. Continue?");
        if (!ok) return;

        // Call your SQL function via RPC
        const { error } = await supabase.rpc("delete_user_account"); // docs: rpc() :contentReference[oaicite:0]{index=0}
        if (error) {
          msg2.textContent = `Delete failed: ${error.message}`;
          return;
        }

        // Session may still exist in browser storage; clear it.
        await supabase.auth.signOut();

        msg2.textContent = "Your account has been deleted.";
        setSignedInUI(null);
      });

      // On load: check if already signed in
      const { data: { session } } = await supabase.auth.getSession();
      setSignedInUI(session?.user ?? null);
    </script>
  </body>
</html>
