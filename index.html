<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Delete Account</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 40px auto;
      padding: 0 16px;
      background: #ffffff;
    }

    img {
      display: block;
      margin: 0 auto 30px;
      max-width: 220px;
    }

    h2 {
      text-align: center;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font-size: 15px;
    }

    button {
      cursor: pointer;
    }

    .box {
      border: 1px solid #ddd;
      padding: 16px;
      border-radius: 10px;
    }

    .muted {
      color: #666;
      font-size: 14px;
    }

    .danger {
      background: #b00020;
      color: #fff;
      border: none;
    }

    .google {
      background: #ffffff;
      border: 1px solid #ccc;
    }
  </style>
</head>

<body>

  <!-- LOGO (from same GitHub folder) -->
  <img src="hbot-logo.png" alt="App Logo">

  <h2>Delete Your Account</h2>

  <!-- SIGNED OUT -->
  <div class="box" id="signedOutBox">
    <p class="muted">Sign in to delete your account.</p>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button id="signInBtn">Sign In</button>

    <button class="google" id="googleBtn">Sign in with Google</button>

    <p id="msg" class="muted"></p>
  </div>

  <!-- SIGNED IN -->
  <div class="box" id="signedInBox" style="display:none;">
    <p id="who" class="muted"></p>

    <p><strong>Warning:</strong> This permanently deletes your account and all data.</p>

    <label class="muted">Type <strong>DELETE</strong> to confirm:</label>
    <input id="confirmText" placeholder="DELETE">

    <button class="danger" id="deleteBtn" disabled>Delete My Account</button>
    <button id="signOutBtn">Sign Out</button>

    <p id="msg2" class="muted"></p>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // 🔴 REPLACE THESE
    const SUPABASE_URL = "https://mvmvqycvorstsftcldzs.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12bXZxeWN2b3JzdHNmdGNsZHpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTUwMDczNTQsImV4cCI6MjA3MDU4MzM1NH0.gA744wsXronSyRXHCS60DVcVqJ3_y0MgkqEhLsFxYDI";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const signedOutBox = document.getElementById("signedOutBox");
    const signedInBox = document.getElementById("signedInBox");
    const msg = document.getElementById("msg");
    const msg2 = document.getElementById("msg2");

    const signInBtn = document.getElementById("signInBtn");
    const googleBtn = document.getElementById("googleBtn");
    const signOutBtn = document.getElementById("signOutBtn");
    const deleteBtn = document.getElementById("deleteBtn");
    const confirmText = document.getElementById("confirmText");

    function setUI(user) {
      if (user) {
        signedOutBox.style.display = "none";
        signedInBox.style.display = "block";
        document.getElementById("who").textContent = `Signed in as ${user.email}`;
      } else {
        signedInBox.style.display = "none";
        signedOutBox.style.display = "block";
      }
    }

    confirmText.addEventListener("input", () => {
      deleteBtn.disabled = confirmText.value.trim() !== "DELETE";
    });

    signInBtn.onclick = async () => {
      msg.textContent = "";
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) msg.textContent = error.message;
      else setUI(data.user);
    };

    googleBtn.onclick = async () => {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: window.location.href }
      });
      if (error) msg.textContent = error.message;
    };

    signOutBtn.onclick = async () => {
      await supabase.auth.signOut();
      setUI(null);
    };

    deleteBtn.onclick = async () => {
      msg2.textContent = "";

      if (!confirm("This action is permanent. Continue?")) return;

      const { error } = await supabase.rpc("delete_user_account");
      if (error) {
        msg2.textContent = error.message;
        return;
      }

      await supabase.auth.signOut();
      msg2.textContent = "Your account has been permanently deleted.";
      setUI(null);
    };

    const { data: { session } } = await supabase.auth.getSession();
    setUI(session?.user ?? null);
  </script>

</body>
</html>
